server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CDN 用 HTTP 回源时，禁止生成 http:// 绝对跳转（否则会和 HTTPS/HSTS 打架）
    absolute_redirect off;
    port_in_redirect off;

    # Astro SSG：/solutions → 直接找 /solutions/index.html，不要 301 加斜杠
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
